name: Schedule - Week

on:
  schedule:
    # Sunday 18:00 Kyiv = 15:00 UTC while summer time (EEST, UTC+3) is in effect.
    # DST ends 2026-10-25 — after that, Kyiv is UTC+2 (EET), so switch this
    # to "0 16 * * 0" (16:00 UTC = 18:00 Kyiv in winter).
    - cron: "0 15 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Post schedule (week) to Schedule thread
        env:
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_SCHEDULE_THREAD_ID: ${{ secrets.TG_SCHEDULE_THREAD_ID }}
        run: |
          python calendar_bot.py week

      - name: Commit state
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add state.json
            git commit -m "Update state (week)"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit."
          fi
