name: Schedule - Week

on:
  # Автоматично тижневий пост виходить разом із вечірнім у неділю
  # (schedule_tomorrow.yml). Цей workflow — для ручного запуску:
  # «Опублікувати поточний тиждень» = розклад цього тижня в будь-який день.
  workflow_dispatch:
    inputs:
      force:
        description: "Опублікувати поточний тиждень зараз (не лише в неділю)"
        type: boolean
        default: false

permissions:
  contents: write

# Два запуски одного поста — лише по черзі (захист від дублів)
concurrency:
  group: schedule-week
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Post schedule (week)
        env:
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_SCHEDULE_THREAD_ID: ${{ secrets.TG_SCHEDULE_THREAD_ID }}
        run: |
          python calendar_bot.py week ${{ inputs.force && '--force' || '' }}

      - name: Commit state
        run: |
          if [[ -n "$(git status --porcelain -- state.json)" ]]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add state.json
            git commit -m "Update state (week)"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit."
          fi
