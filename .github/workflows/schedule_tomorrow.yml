name: Schedule - Tomorrow

on:
  # Щодня ~18:17 за Києвом (у неділю — ще й тижневий розклад). Хвилина :17, а не :00 — менше черга в GitHub і менше запізнень.
  # Час UTC: взимку Київ = UTC+2. Улітку (з останньої неділі березня) Київ = UTC+3 —
  # тоді годину в cron треба зменшити на 1.
  # Якщо налаштуєш точний запуск з cron-job.org (через workflow_dispatch), цей
  # розклад стане запасним: повторний запуск бот пропустить за state.json.
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Два запуски одного поста — лише по черзі (захист від дублів)
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Post schedule (tomorrow)
        env:
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python calendar_bot.py tomorrow

      # У неділю ввечері — ще й розклад на наступний тиждень (у гілку «Розклад»)
      - name: Post schedule (week, on Sundays)
        if: always()
        env:
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_SCHEDULE_THREAD_ID: ${{ secrets.TG_SCHEDULE_THREAD_ID }}
        run: |
          if [ "$(TZ=Europe/Kyiv date +%u)" = "7" ]; then
            python calendar_bot.py week
          else
            echo "Not Sunday — no weekly post."
          fi

      - name: Commit state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain -- state.json)" ]]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add state.json
            git commit -m "Update state (evening)"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit."
          fi
