name: Schedule - Today

on:
  # Ранковий пост: спроби о 05:00, 05:20, 05:40, 06:00, 06:20 за Києвом.
  # Кілька запусків поспіль: розклад GitHub часто запізнюється, тож пост
  # публікує перший запуск, що спрацював, а решта бачать у state.json, що пост
  # уже вийшов, і нічого не роблять. Пости до 07:00 і після 22:00 — без звуку.
  # Час у cron — UTC: взимку Київ = UTC+2. Улітку (з останньої неділі березня)
  # Київ = UTC+3 — тоді годину в кожному рядку треба зменшити на 1.
  # Точний час дає cron-job.org (через workflow_dispatch), цей розклад — запасний.
  schedule:
    - cron: "0 3 * * *"
    - cron: "20 3 * * *"
    - cron: "40 3 * * *"
    - cron: "0 4 * * *"
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Два запуски одного поста — лише по черзі (захист від дублів)
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Post schedule (today)
        env:
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python calendar_bot.py today

      - name: Commit state
        run: |
          if [[ -n "$(git status --porcelain -- state.json)" ]]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add state.json
            git commit -m "Update state (today)"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit."
          fi
